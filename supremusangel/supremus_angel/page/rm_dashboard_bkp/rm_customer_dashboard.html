<div class="row">
    <div class="col-lg-9">
      <div class="rm-dashboard" id="rm-customer-dashboard">
  
        <!-- Step Wizard (starts at Customer) -->
        <div class="rm-step-wizard">
          <div class="rm-step rm-step-complete" data-step="lead">
            <div class="rm-step-badge">1</div>
            <div class="rm-step-label">Lead</div>
          </div>
          <div class="rm-step rm-step-active" data-step="customer">
            <div class="rm-step-line"></div>
            <div class="rm-step-badge">2</div>
            <div class="rm-step-label">Customer KYC</div>
          </div>
          <div class="rm-step" data-step="payment">
            <div class="rm-step-line"></div>
            <div class="rm-step-badge">3</div>
            <div class="rm-step-label">Payment</div>
          </div>
          <div class="rm-step" data-step="sales-order">
            <div class="rm-step-line"></div>
            <div class="rm-step-badge">4</div>
            <div class="rm-step-label">Sales Order</div>
          </div>
        </div>
  
        <!-- Customer Info + KYC -->
        <div class="rm-section" id="customer-main-section">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 id="customer-title">Customer</h4>
            <button class="btn btn-sm btn-outline-secondary" id="switch-customer-btn">
              Switch Customer
            </button>
          </div>
  
          <div class="row">
            <div class="col-md-7">
              <div class="form-group"><label>Customer Name:</label> <span id="cust_name_view">-</span></div>
              <div class="form-group"><label>Demat Account:</label> <span id="cust_demat_view">-</span></div>
              <div class="form-group"><label>Bank Account:</label> <span id="cust_bank_view">-</span></div>
              <div class="form-group"><label>Status:</label> <span id="cust_state_view"></span></div>
            </div>
            <div class="col-md-5">
              <h6>Upcoming Meetings / Events</h6>
              <div class="rm-table-wrapper">
                <table class="table table-sm table-dark rm-history-table">
                  <thead>
                    <tr>
                      <th>When</th>
                      <th>Subject</th>
                    </tr>
                  </thead>
                  <tbody id="cust_events_body"></tbody>
                </table>
              </div>
            </div>
          </div>
  
          <hr>
  
          <h6>KYC Details</h6>
          <form id="customer-kyc-form">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group"><label>Phone:</label>
                  <input type="text" class="form-control" name="phone">
                </div>
                <div class="form-group"><label>WhatsApp:</label>
                  <input type="text" class="form-control" name="whatsapp_no">
                </div>
                <div class="form-group"><label>PAN Card:</label>
                  <input type="text" class="form-control" name="pan_card">
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group"><label>Aadhar Card:</label>
                  <input type="text" class="form-control" name="aadhar_card">
                </div>
                <div class="form-group"><label>Bank Account:</label>
                  <input type="text" class="form-control" name="bank_account">
                </div>
                <div class="form-group"><label>Bank IFSC:</label>
                  <input type="text" class="form-control" name="bank_ifsc">
                </div>
              </div>
            </div>
  
            <div class="rm-wizard-actions">
              <button type="button" class="btn btn-primary" id="btn-save-kyc">
                Update KYC
              </button>
            </div>
          </form>
        </div>
  
        <!-- Purchase History -->
        <div class="rm-section" id="customer-history-section">
          <h4>Purchase History</h4>
          <div class="rm-table-wrapper">
            <table class="table table-sm table-dark rm-history-table">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Posting Date</th>
                  <th>Rate</th>
                  <th>Invoice</th>
                </tr>
              </thead>
              <tbody id="cust_history_body"></tbody>
            </table>
          </div>
        </div>
  
        <!-- Payment & Sales Order same as lead page -->
        <div class="rm-section" id="payment-section">
          <!-- same payment form as above -->
        </div>
  
        <div class="rm-section" id="sales-order-section">
          <!-- same SO form as above -->
        </div>
  
      </div>
    </div>
  
    <div class="col-lg-3">
      <div class="rm-sidebar">
        <h5>Item Prices</h5>
        <div id="sidebar-item-prices"></div>
      </div>
    </div>
  </div>
