<div class="layout-main-section">
  <div class="rm-dashboard" id="rm-dashboard-root">
    <div class="rm-step-wizard rm-mode-bar">
      <span class="rm-mode-label">Start with:</span>
      <button class="btn btn-sm rm-mode-btn" data-mode="lead">Lead</button>
      <button class="btn btn-sm rm-mode-btn" data-mode="customer">Customer</button>
    </div>

    <!-- Step Wizard -->
    <div class="rm-step-wizard">
      <div class="rm-step rm-step-active" data-step="lead">
        <div class="rm-step-badge">1</div>
        <div class="rm-step-label">Lead</div>
      </div>
      <div class="rm-step" data-step="customer">
        <div class="rm-step-line"></div>
        <div class="rm-step-badge">2</div>
        <div class="rm-step-label">Customer KYC</div>
      </div>
      <div class="rm-step" data-step="payment">
        <div class="rm-step-line"></div>
        <div class="rm-step-badge">3</div>
        <div class="rm-step-label">Payment</div>
      </div>
      <div class="rm-step" data-step="sales-order">
        <div class="rm-step-line"></div>
        <div class="rm-step-badge">4</div>
        <div class="rm-step-label">Sales Order</div>
      </div>
    </div>

    <!-- VIEW: LEAD -->
    <div class="rm-section" id="view-lead">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h4 id="lead-title">Lead</h4>
        <button class="btn btn-sm btn-outline" id="lead-status">-</button>
        <button class="btn btn-sm btn-outline-primary" id="btn-edit-lead">Edit Lead Data</button>
        <button class="btn btn-sm btn-outline-danger" id="btn-switch-lead">Switch Lead</button>
      </div>

      <div class="row">
        <div class="col-md-7">
          <div class="form-group"><label>Lead Name:</label> <span id="lead_name">-</span></div>
          <div class="form-group"><label>Phone:</label> <span id="lead_phone">-</span></div>
          <div class="form-group"><label>WhatsApp:</label> <span id="lead_whatsapp">-</span></div>
          <div class="form-group"><label>Email:</label> <span id="lead_email">-</span></div>
          <div class="form-group"><label>Address:</label> <span id="lead_address">-</span></div>
          <div class="form-group"><label>Assigned To:</label> <span id="lead_owner">-</span></div>
          <div class="form-group">
            <label>Linked Customer:</label>
            <span id="lead_customer_link">No</span>
          </div>
        </div>
        <div class="col-md-5">
          <h6>Timeline</h6>
          <div id="lead_timeline" class="rm-timeline"></div>
        </div>
      </div>

      <div class="rm-activities mt-3">
        <button class="btn btn-outline-primary rm-btn-meeting">Meeting</button>
        <button class="btn btn-outline-primary rm-btn-call">Call</button>
        <button class="btn btn-outline-primary rm-btn-email">Email</button>
        <button class="btn btn-primary" id="btn-onboard-customer">
          Onboard as Customer
        </button>
        <button class="btn btn-primary hidden" id="btn-goto-customer">
          Go To Customer
        </button>
        <button class="btn btn-primary hidden" id="btn-goto-payments">
          Go To Payments
        </button>
        <button class="btn btn-primary hidden" id="btn-goto-orders">
          Go To Orders
        </button>
      </div>
      <div class="rm-activities mt-3">
        <!-- <button class="btn btn-outline-primary" id="btn-new-meeting">New Meeting</button>
        <button class="btn btn-outline-primary" id="btn-update-meeting">Update Meeting Status</button>
        <button class="btn btn-outline-primary" id="btn-upload-selfie">Upload Selfie/Signboard</button> -->
      </div>
    </div>

    <!-- VIEW: CUSTOMER (KYC + status + purchase history) -->
    <div class="rm-section" id="view-customer" style="display:none;">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
          <h4 id="customer-title">Customer</h4>
          <div class="mt-1">
            <span id="customer-state-badge"></span>
          </div>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="btn-switch-customer">
          Switch Customer
        </button>
      </div>

      <div class="row">
        <div class="col-md-7">
          <div class="form-group"><label>Customer Name:</label> <span id="cust_name_view">-</span></div>
          <div class="form-group"><label>Demat Account:</label> <span id="cust_demat_view">-</span></div>
          <div class="form-group"><label>Bank Account:</label> <span id="cust_bank_view">-</span></div>
        </div>
        <div class="col-md-5">
          <h6>Upcoming Meetings / Events</h6>
          <div class="rm-table-wrapper">
            <table class="table table-sm table-light rm-history-table">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Subject</th>
                </tr>
              </thead>
              <tbody id="cust_events_body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <hr>

      <div class="row">
        <div class="col-md-7">
          <h6>KYC Details</h6>
          <form id="customer-kyc-form">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group"><label>Phone:</label>
                  <input type="text" class="form-control" name="phone">
                </div>
                <div class="form-group"><label>WhatsApp:</label>
                  <input type="text" class="form-control" name="whatsapp_no">
                </div>
                <div class="form-group"><label>PAN Card:</label>
                  <input type="text" class="form-control" name="pan_card">
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group"><label>Aadhar Card:</label>
                  <input type="text" class="form-control" name="aadhar_card">
                </div>
                <div class="form-group"><label>Bank Account:</label>
                  <input type="text" class="form-control" name="bank_account">
                </div>
                <div class="form-group"><label>Bank IFSC:</label>
                  <input type="text" class="form-control" name="bank_ifsc">
                </div>
              </div>
            </div>
            <div class="rm-wizard-actions">
              <button type="button" class="btn btn-primary" id="btn-save-kyc">Update KYC</button>
            </div>
          </form>
        </div>

        <div class="col-md-5">
          <h6>Purchase History</h6>
          <div class="rm-table-wrapper" id="cust-history-wrapper">
            <table class="table table-sm table-light rm-history-table">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Posting Date</th>
                  <th>Rate</th>
                  <th>Invoice</th>
                </tr>
              </thead>
              <tbody id="cust_history_body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- VIEW: PAYMENT -->
    <div class="rm-section" id="view-payment" style="display:none;">
      <h4>Payment (Wire Transfer)</h4>
      <form id="payment-form">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group"><label>Customer:</label>
              <input type="text" class="form-control" name="party" readonly>
            </div>
            <div class="form-group"><label>Paid Amount:</label>
              <input type="number" class="form-control" name="paid_amount" step="0.01" required>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group"><label>Customer Bank Account:</label>
              <input type="text" class="form-control" name="customer_bank" readonly>
            </div>
            <div class="form-group"><label>Transaction Reference:</label>
              <input type="text" class="form-control" name="reference_no">
            </div>
          </div>
        </div>
        <div class="rm-wizard-actions">
          <button type="button" class="btn btn-secondary" id="btn-payment-back">Back</button>
          <button type="button" class="btn btn-primary" id="btn-save-payment">
            Save &amp; Submit for Verification
          </button>
        </div>
      </form>
    </div>

    <!-- VIEW: SALES ORDER -->
    <div class="rm-section" id="view-sales-order" style="display:none;">
      <h4>Sales Order</h4>
      <form id="sales-order-form">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group"><label>Customer:</label>
              <input type="text" class="form-control" name="customer" readonly>
            </div>
            <div class="form-group"><label>Total:</label> <span id="so-total">0</span></div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label>Items</label>
              <div id="item-table"></div>
              <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-add-item">
                Add Item
              </button>
            </div>
          </div>
        </div>
        <div class="rm-wizard-actions">
          <button type="button" class="btn btn-secondary" id="btn-so-back">Back</button>
          <button type="button" class="btn btn-primary" id="btn-save-so">Save &amp; Submit</button>
        </div>
      </form>
    </div>



    <!-- Footer navigation bar -->
    <!-- <div class="rm-footer-bar">
      <div class="rm-footer-inner">
        <button type="button" class="btn btn-secondary" id="rm-btn-prev">
          Previous
        </button>
        <button type="button" class="btn btn-primary" id="rm-btn-next">
          Next
        </button>
      </div>
    </div> -->

  </div>

</div>
